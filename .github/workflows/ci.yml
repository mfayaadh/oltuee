name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      - name: Cross-compile binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/oltuee-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/oltuee-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/oltuee-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/oltuee-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/oltuee-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/oltuee-windows-arm64.exe .
          ls -lh dist/
